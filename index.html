<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tee Sheet</title>
<meta name="theme-color" content="#1d6a47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tee Sheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f2; --surface:#ffffff; --ink:#16211b; --muted:#5d6b62; --line:#d9e1da;
  --accent:#1d6a47; --accent-soft:#e2efe7; --accent-ink:#ffffff;
  --warn:#9a5b00; --warn-soft:#fbefd9; --danger:#a5352c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1512; --surface:#17201b; --ink:#e4ece6; --muted:#9aa89f; --line:#2a3630;
  --accent:#5cc28f; --accent-soft:#1d3328; --accent-ink:#0b130f;
  --warn:#e5ad55; --warn-soft:#352813; --danger:#ef8a80; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:700 1.6rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
.clock{font:500 .95rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.theme{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.now .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.now h2{font:700 1.45rem/1.15 var(--display);margin:0;text-wrap:balance}
.left{font:500 .9rem var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.next-task{border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next-task p{margin:0;font-weight:500;min-width:0;flex:1 1 220px}
.upnext{font-size:.88rem;color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.switch{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.capture,.add{display:flex;gap:8px}
.capture input,.add input[type=text]{flex:1}
.mic{padding:6px 10px;flex:none}
.mic.on{background:var(--danger);color:#fff;border-color:var(--danger)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:8px 10px;white-space:nowrap;font-weight:500}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font:500 .72rem var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 6px;margin-left:4px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .txt{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.item.isnext .txt{font-weight:600}
.item.isnext .txt::before{content:"▶ ";color:var(--accent)}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tee{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);width:3.2em;flex:none}
.block{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:flex-start}
.block.cur{background:var(--accent-soft);border-radius:8px}
.block.past{opacity:.55}
.block .b{flex:1;min-width:0}
.block .t{font-weight:600}
.block .s{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.block.rest .t{font-weight:400;color:var(--muted)}
.proj{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.proj h3{font:600 1.05rem var(--display);margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.proj h3 small{font:400 .8rem var(--body);color:var(--muted)}
.proj .ph{cursor:pointer;user-select:none}
.proj .chev{display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
.proj.open .chev{transform:rotate(90deg)}
.proj .peek{font-size:.88rem;color:var(--muted);margin:0 0 0 1.5em;overflow-wrap:anywhere}
.over{color:var(--danger);font-weight:600}
.due{font:500 .82rem var(--mono);color:var(--muted)}
.empty{color:var(--muted);padding:14px 4px}
.dayhead{font:600 .8rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:14px}
.review,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.review ol{margin:6px 0 0;padding-left:20px}
.auth{display:flex;flex-direction:column;gap:12px;max-width:380px}
.auth input{width:100%}
.err{color:var(--danger);font-size:.9rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border-radius:999px;padding:4px 12px;font-size:.88rem}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips small{font-size:.7rem;opacity:.8;margin-left:4px}
.dayhead2{font:600 1.05rem var(--display);margin:4px 0 6px}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font:600 .68rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;margin-top:6px}
.times label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.edrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 4px;border-bottom:1px solid var(--line)}
.edrow .nm{flex:1 1 140px;min-width:0}
.offcard{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.offcard .acts{gap:8px}
.catch{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.swap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.weekwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.week{border-collapse:collapse;min-width:640px;width:100%;font-size:.85rem}
table.week th,table.week td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.week th{font-weight:600}
table.week th small{display:block;font-weight:400;color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.week td.time{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap}
table.week td.rest{color:var(--muted)}
table.week .today{background:var(--accent-soft)}
table.week .nt{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="theme" id="theme">—</div>
      <h1>Tee Sheet</h1>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <!-- Sign-in -->
  <section class="card auth" id="auth" hidden>
    <div class="label">Sign in</div>
    <form id="authForm" class="auth" autocomplete="on">
      <input type="email" id="email" placeholder="Email" required autocomplete="email" aria-label="Email">
      <input type="password" id="password" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="current-password" aria-label="Password">
      <div class="acts">
        <button class="primary" type="submit" id="signInBtn">Sign in</button>
        <button type="button" id="signUpBtn">Create account</button>
      </div>
      <p class="err" id="authMsg" hidden></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">
    <section class="now" id="now" aria-live="polite"></section>
    <form class="capture" id="capture" autocomplete="off">
      <input type="text" id="captureText" placeholder="Capture an idea, task or blocker → Inbox" aria-label="Capture to Inbox">
      <button class="primary" type="submit">Capture</button>
    </form>
    <nav role="tablist" id="tabs"></nav>
    <main id="view"><p class="empty">Loading your tasks…</p></main>
    <footer>
      <span id="who"></span>
      <span class="acts">
        <button class="ghost" id="installBtn" hidden>Install app</button>
        <button class="ghost" id="signOutBtn">Sign out</button>
      </span>
    </footer>
  </div>
  <p class="err" id="configMsg" hidden>Supabase isn't configured yet. Add your project URL and key in config.js.</p>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- schedule ---------- */
// Projects and each day's three project blocks live in the database (tables `projects` and `days`).
// These defaults are only used until the data loads, and to set up a brand-new account.
const DEFAULT_PROJECTS=[
  ["job","Job Search",""],["catalogue","Giveaway Catalogue","Merkitt"],["vive","Vive Manila","Relaunch + website"],
  ["coaching","Golf Coaching","Curriculum + TPI"],["company","Company Registration","Law firm"],["website","Company Website",""],
  ["anthropic","Anthropic Training",""],["oned","ONED","Golf equipment, apparel, balls"],["simulator","Indoor Golf Simulator","Research"]
].map(([key,name,note],i)=>({key,name,note,sort:(i+1)*10,active:true}));
const DEFAULT_DAYS=[
  {dow:1,theme:"Website day",slots:[{project:"website",label:"Company Website"},{project:"website",label:"Company Website"},{project:"vive",label:"Vive Manila Website"}]},
  {dow:2,theme:"Merkitt day",slots:[{project:"company",label:"Company Registration (law firm)"},{project:"catalogue",label:"Giveaway Catalogue"},{project:"catalogue",label:"Giveaway Catalogue (outreach)"}]},
  {dow:3,theme:"Golf day",slots:[{project:"coaching",label:"Golf Coaching"},{project:"oned",label:"ONED"},{project:"simulator",label:"Indoor Simulator"}]},
  {dow:4,theme:"Vive Manila day",slots:[{project:"vive",label:"Vive Manila relaunch planning"},{project:"vive",label:"Vive Manila Website"},{project:"vive",label:"Vive Manila marketing"}]},
  {dow:5,theme:"Learn & Coaching day",slots:[{project:"anthropic",label:"Anthropic Training"},{project:"coaching",label:"Golf Coaching Curriculum"},{project:"anthropic",label:"Flex",flex:true}]}
];
// Every day has the same nine blocks; their start times (and the day's end) can be changed per weekday,
// and any single date this week can be changed or swapped via a row in `day_overrides`.
const BLOCK_DEFS=[
  {key:"plan",label:"Plan the day",kind:"ritual",note:"Check Inbox and Waiting. Read today's blocks."},
  {key:"job",label:"Job Search",p:"job"},
  {key:"brk1",label:"Break",kind:"rest"},
  {key:"s0",slot:0},
  {key:"lunch",label:"Lunch",kind:"rest"},
  {key:"s1",slot:1},
  {key:"brk2",label:"Break",kind:"rest"},
  {key:"s2",slot:2},
  {key:"wrap"}
];
const DEFAULT_TIMES={plan:"09:00",job:"09:15",brk1:"10:45",s0:"11:00",lunch:"12:00",s1:"13:00",brk2:"15:00",s2:"15:15",wrap:"16:30",end:"17:00"};
const TIME_KEYS=[...BLOCK_DEFS.map(b=>b.key),"end"];
const TIME_LABELS={plan:"Plan the day",job:"Job Search",brk1:"Break",s0:"Block 1",lunch:"Lunch",s1:"Block 2",brk2:"Break",s2:"Block 3",wrap:"Wrap-up",end:"Day ends"};
const SLOT_TIMES=["11:00","13:00","15:15"];
let PROJECTS={}, ORDER=[], SCHED={}, BASE={}, WEEK={}, WEEK_KEY="";
function tmin(s){const [h,m]=String(s||"0:0").split(":").map(Number);return h*60+m}
function timesOk(T){let prev=-1;for(const k of TIME_KEYS){const m=tmin(T[k]);if(!(m>prev))return false;prev=m}return true}
function buildDay(theme,slots,dow,times,base){
  const T={...DEFAULT_TIMES,...(times||{})};
  const s=i=>(slots||[])[i]||{project:"",label:"Open block"};
  const blocks=BLOCK_DEFS.map(d=>{
    let b;
    if(d.slot!=null){const x=s(d.slot);b={label:x.label||PROJECTS[x.project]?.name||"Open block",p:x.project||null,kind:x.flex?"flex":undefined,slot:d.slot,bumped:x.bumped&&x.bumped.length?[...x.bumped]:undefined}}
    else if(d.key==="wrap")b=dow===5?{label:"Weekly Review",kind:"review"}:{label:"Log done / set next",kind:"ritual",note:"Process the Inbox. Tick what's done."};
    else b={label:d.label,kind:d.kind,p:d.p,note:d.note};
    b.key=d.key;b.t=T[d.key];
    if(base){const o=base.blocks.find(x=>x.key===d.key);if(o&&(o.t!==b.t||o.label!==b.label||o.p!==b.p||o.kind!==b.kind||!!b.bumped))b.changed=true}
    return b;
  });
  const day={theme,blocks,times:T,end:tmin(T.end)};
  day.changed=!!base&&(theme!==base.theme||day.end!==base.end||blocks.some(b=>b.changed));
  return day;
}
// Mon–Fri dates of the current week (on a weekend: the coming week).
function weekDates(t=manila()){
  const [y,m,d]=t.ymd.split("-").map(Number), base=Date.UTC(y,m-1,d), off=t.dow===0?1:t.dow===6?2:1-t.dow, W={};
  for(let i=1;i<=5;i++)W[i]=new Date(base+(off+i-1)*864e5).toISOString().slice(0,10);
  return W;
}
const baseRow=dow=>S.days.find(d=>d.dow===dow)||DEFAULT_DAYS.find(d=>d.dow===dow);
const overOf=dow=>(S.over||[]).find(o=>o.date===WEEK[dow]);
function effRow(dow){const b=baseRow(dow),o=overOf(dow);return {theme:o?.theme??b.theme,slots:o?.slots??b.slots??[],times:{...(b.times||{}),...(o?.times||{})},off:!!o?.off,moved:o?.moved||[]}}
function rebuild(projects,days,overrides){
  PROJECTS={};for(const p of projects)PROJECTS[p.key]={name:p.name,note:p.note,active:p.active,sort:p.sort};
  ORDER=projects.filter(p=>p.active).sort((a,b)=>a.sort-b.sort).map(p=>p.key);
  WEEK=weekDates();WEEK_KEY=WEEK[1];
  BASE={};SCHED={};
  for(let dow=1;dow<=5;dow++){
    const r=days.find(d=>d.dow===dow)||DEFAULT_DAYS.find(d=>d.dow===dow);
    BASE[dow]=buildDay(r.theme,r.slots||[],dow,r.times);
    const o=(overrides||[]).find(x=>x.date===WEEK[dow]);
    SCHED[dow]=o?buildDay(o.theme??r.theme,o.slots??r.slots??[],dow,{...(r.times||{}),...(o.times||{})},BASE[dow]):BASE[dow];
    if(o&&o.off)SCHED[dow]={...SCHED[dow],off:true,changed:true,moved:o.moved||[]};
  }
}
rebuild(DEFAULT_PROJECTS,DEFAULT_DAYS,[]);
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const fmt=m=>{const h=Math.floor(m/60),mm=m%60;return (((h+11)%12)+1)+":"+String(mm).padStart(2,"0")};
function manila(d=new Date()){
  const p={};for(const x of new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Manila",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d))p[x.type]=x.value;
  return {dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday),mins:+p.hour*60+ +p.minute,secs:+p.second,ymd:`${p.year}-${p.month}-${p.day}`};
}
function withEnds(blocks,end){return blocks.map((b,i)=>({...b,start:toMin(b.t),end:i<blocks.length-1?toMin(blocks[i+1].t):end,i}))}
function blockState(t=manila()){
  const s=SCHED[t.dow];
  if(!s)return {weekend:true};
  if(s.off)return {weekend:true,off:true};
  const bl=withEnds(s.blocks,s.end);
  if(t.mins<bl[0].start)return {sched:s,bl,before:true,next:bl[0]};
  if(t.mins>=s.end)return {sched:s,bl,after:true};
  const cur=bl.find(b=>t.mins>=b.start&&t.mins<b.end);
  return {sched:s,bl,cur,next:bl[cur.i+1]};
}

/* ---------- state ---------- */
const CFG=window.TEE_CONFIG||{};
const configured=CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes("YOUR-")&&window.supabase;
const sb=configured?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const S={tasks:[],inbox:[],waiting:[],someday:[],projects:[],days:[],over:[],loaded:false};
let seeding=false, editSched=false, editDay=null, skipAsk=null;
let session=null, tab="today", chime=false, lastBlockKey=null, switchMsg="";
try{tab=localStorage.getItem("tee-tab")||"today";chime=localStorage.getItem("tee-chime")==="1"}catch(e){}

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){if(k==null||k===false)continue;el.append(k.nodeType?k:document.createTextNode(String(k)))}
  return el;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3500)}
const nowISO=()=>new Date().toISOString();
const tasksOf=p=>S.tasks.filter(t=>t.project===p).sort((a,b)=>a.ord-b.ord);
const nextOf=p=>tasksOf(p).find(t=>!t.done);
const maxOrd=p=>tasksOf(p).reduce((m,t)=>Math.max(m,t.ord||0),0);

/* ---------- data ---------- */
async function load(){
  if(!sb||!session)return;
  const [t,i,w,s,p,d,ov]=await Promise.all([...["tasks","inbox","waiting","someday","projects"].map(n=>sb.from(n).select("*").order("created_at")),sb.from("days").select("*").order("dow"),sb.from("day_overrides").select("*").gte("date",weekDates()[1])]);
  const err=[t,i,w,s,p,d].find(r=>r.error);
  if(err){toast(navigator.onLine?"Couldn't load tasks: "+err.error.message:"You're offline. Showing the last loaded tasks.");return}
  // A brand-new account gets the default projects and schedule.
  if(!p.data.length&&!seeding){seeding=true;
    await sb.from("projects").insert(DEFAULT_PROJECTS);
    if(!d.data.length)await sb.from("days").insert(DEFAULT_DAYS);
    seeding=false;return load();
  }

let OPENP=new Set();try{OPENP=new Set(JSON.parse(localStorage.getItem("tee-openp")||"[]"))}catch(e){}
function viewProjects(){
  if(S.loaded&&!S.tasks.length)return [h("div",{class:"card"},h("p",{class:"hint"},"No tasks yet. Load the starter list from your plan?"),h("p",{},h("button",{class:"primary",onclick:e=>{e.target.disabled=true;A.seed()}},"Load my starter tasks")))];

  const archived=S.projects.filter(p=>!p.active);

    h("div",{class:"list"},archived.map(p=>h("div",{class:"item"},h("div",{class:"txt"},p.name),h("button",{onclick:()=>A.restoreProject(p.key)},"Restore"))))):null;

          if(e.target.dataset.armed){A.archiveProject(p)}else{e.target.dataset.armed="1";e.target.textContent="Confirm archive"}}},"Archive"):null),
      !isOpen?(n?h("p",{class:"peek"},"▶ "+n.text):null):null,
      !isOpen?null:h("div",{class:"list"},open.length?open.map((t,i)=>h("div",{class:`item${t===n?" isnext":""}`},

          t!==n?h("button",{class:"ghost",title:"Make this the next task",onclick:()=>A.makeNext(t)},"▶"):null,
          h("button",{class:"ghost","aria-label":"Move up",disabled:i===0||null,onclick:()=>A.move(t,-1)},"↑"),

      !isOpen?null:h("form",{class:"add",onsubmit:e=>{e.preventDefault();const v=inp.value.trim();if(v){A.addTask(p,v);inp.value=""}}},inp,micBtn("add-"+p),h("button",{type:"submit"},"Add")));
  }),archCard];

function viewWaiting(){

function viewDone(){
  const cutoff=Date.now()-7*864e5;
  const done=S.tasks.filter(t=>t.done&&t.done_at&&Date.parse(t.done_at)>=cutoff).sort((a,b)=>a.done_at<b.done_at?1:-1);

function render(){
  if(!session)return;
  renderNow();renderTabs();
  const v=$("#view");v.replaceChildren();
  if(!S.loaded){v.append(h("p",{class:"empty"},"Loading your tasks…"));return}
  const fn={today:viewToday,week:viewWeek,projects:viewProjects,inbox:viewInbox,waiting:viewWaiting,someday:viewSomeday,done:viewDone}[tab]||viewToday;
  v.append(...[fn()].flat(3).filter(Boolean));

// Avoid wiping a half-typed entry when data refreshes.
function safeRender(){
  if(micRec){renderNow();renderTabs();return}
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#view")&&((a.tagName==="INPUT"&&a.value)||a.tagName==="SELECT")){renderNow();renderTabs();return}
  render();
}

/* ---------- voice dictation ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micRec=null;
function micBtn(id){
  if(!SR)return null;
  return h("button",{type:"button",class:"mic","aria-label":"Speak instead of typing",title:"Speak",onclick:e=>toggleMic(id,e.currentTarget)},"🎤");
}
function micReset(){document.querySelectorAll(".mic.on").forEach(b=>{b.classList.remove("on");b.textContent="🎤"})}
function toggleMic(id,btn){
  if(micRec){micRec.stop();return}
  const el=document.getElementById(id);if(!el)return;
  const base=el.value.trim()?el.value.trim()+" ":"";
  const r=new SR();
  r.lang=navigator.language||"en-US";r.interimResults=true;r.continuous=false;
  r.onresult=ev=>{let t="";for(const x of ev.results)t+=x[0].transcript;const f=document.getElementById(id);if(f)f.value=base+t.trim()};
  r.onerror=ev=>{
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed")toast("Allow microphone access to use voice.");
    else if(ev.error==="no-speech")toast("Didn't catch that. Tap 🎤 and try again.");
    else if(ev.error!=="aborted")toast("Voice isn't working right now. Type instead.");
  };
  r.onend=()=>{micRec=null;micReset();const f=document.getElementById(id);if(f){f.focus();safeRender()}};
  micRec=r;btn.classList.add("on");btn.textContent="■";
  try{r.start()}catch(e){micRec=null;micReset();toast("Voice isn't working right now. Type instead.")}
}

/* ---------- tick ---------- */
function tick(){
  if(!session){renderClock();return}
  if(weekDates()[1]!==WEEK_KEY){rebuild(S.projects.length?S.projects:DEFAULT_PROJECTS,S.days,S.over);reload()}
  const st=blockState();
  const key=st.cur?st.cur.t:st.after?"after":st.before?"before":"wk";
  if(lastBlockKey&&key!==lastBlockKey&&st.cur){switchMsg=`Time to switch → ${st.cur.label}`;if(chime)beep()}
  lastBlockKey=key;
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#now"))return;
  if(tab==="today")safeRender();else renderNow();
}

/* ---------- auth ---------- */
function showAuth(msg){
  $("#auth").hidden=false;$("#app").hidden=true;
  const m=$("#authMsg");m.hidden=!msg;m.textContent=msg||"";
}
let channel=null;
function showApp(){
  $("#auth").hidden=true;$("#app").hidden=false;
  $("#who").textContent=session.user.email;
  render();load();
  if(!channel){
    channel=sb.channel("tee-sheet");
    for(const tbl of ["tasks","inbox","waiting","someday","projects","days","day_overrides"])channel.on("postgres_changes",{event:"*",schema:"public",table:tbl},reload);
    channel.subscribe();
  }
}
$("#authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const {data,error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
  if(error)showAuth(error.message);
});
$("#signUpBtn").addEventListener("click",async()=>{
  const email=$("#email").value.trim(),password=$("#password").value;
  if(!email||password.length<6){showAuth("Enter your email and a password of at least 6 characters.");return}
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)showAuth(error.message);
  else if(!data.session)showAuth("Account created. Check your email to confirm, then sign in here.");
});
$("#signOutBtn").addEventListener("click",async()=>{await sb.auth.signOut()});

{const cb=micBtn("captureText");if(cb)$("#captureText").after(cb)}
$("#capture").addEventListener("submit",e=>{e.preventDefault();const i=$("#captureText"),v=i.value.trim();if(!v)return;A.capture(v);i.value="";toast("Captured to Inbox")});

/* ---------- install ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("#installBtn").hidden=false});
$("#installBtn").addEventListener("click",async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$("#installBtn").hidden=true});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- boot ---------- */
renderClock();
setInterval(tick,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session){load();tick()}});
if(!sb){$("#configMsg").hidden=false}
else{
  sb.auth.onAuthStateChange((_evt,s)=>{
    const had=!!session;session=s;
    // Defer: calling Supabase inside this callback can deadlock the auth client.
    if(s){if(!had)setTimeout(showApp,0)}
    else{S.loaded=false;S.tasks=[];showAuth()}
  });
}
